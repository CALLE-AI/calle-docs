name: Diagnose public docs access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Read public docs responses
        run: python3 scripts/probe_public_docs.py
      - name: Save diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-docs-probe
          path: public-docs-probe
          retention-days: 1
